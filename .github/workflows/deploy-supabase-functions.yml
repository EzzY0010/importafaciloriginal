name: Deploy AI vision Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/lobo-vision/**'
      - 'supabase/functions/wolf-vision/**'
      - 'supabase/functions/wolf-chat/**'
      - 'supabase/functions/product-description/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy AI vision Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zmxktmjstvxmlsvdtvaa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy lobo-vision
        run: supabase functions deploy lobo-vision --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy wolf-vision
        run: supabase functions deploy wolf-vision --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy wolf-chat
        run: supabase functions deploy wolf-chat --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy product-description
        run: supabase functions deploy product-description --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
